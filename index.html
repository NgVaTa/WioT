<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSense - Edge AI DO Predictor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ONNX Runtime Web CDN -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col justify-center items-center">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-xl font-black text-sky-400 flex items-center gap-2">
                    <i class="fa-solid fa-microchip text-emerald-400"></i> AquaSense Edge AI
                </h1>
                <p class="text-xs text-slate-400">Dự báo Oxy hòa tan (DO) On-Device 0$ API</p>
            </div>
            <span id="ai-status" class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-amber-500/30">
                Khởi tạo AI...
            </span>
        </div>

        <!-- Input Form (Cảm biến) -->
        <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-slate-700/50 p-3 rounded-2xl border border-slate-600/50">
                <label class="text-slate-400 font-medium block mb-1">pH Nước</label>
                <input type="number" id="input-ph" step="0.1" value="8.1" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2 text-white font-bold text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="bg-slate-700/50 p-3 rounded-2xl border border-slate-600/50">
                <label class="text-slate-400 font-medium block mb-1">Nhiệt độ (°C)</label>
                <input type="number" id="input-temp" step="0.1" value="29.5" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2 text-white font-bold text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="bg-slate-700/50 p-3 rounded-2xl border border-slate-600/50">
                <label class="text-slate-400 font-medium block mb-1">ORP Đáy (mV)</label>
                <input type="number" id="input-orp" step="1" value="280" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2 text-white font-bold text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="bg-slate-700/50 p-3 rounded-2xl border border-slate-600/50">
                <label class="text-slate-400 font-medium block mb-1">Độ mặn EC (ppt)</label>
                <input type="number" id="input-ec" step="0.1" value="18.5" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2 text-white font-bold text-sm focus:outline-none focus:border-sky-500">
            </div>
        </div>

        <!-- Trigger Button -->
        <button id="btn-predict" onclick="runInference()" disabled class="w-full py-3 bg-sky-600 hover:bg-sky-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-brain"></i> DỰ BÁO OXY 3 GIỜ TỚI
        </button>

        <!-- Prediction Result Display -->
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400 uppercase font-semibold">Kết quả AI Dự Báo DO</span>
                <span id="warning-badge" class="hidden text-[10px] bg-rose-500/20 text-rose-400 font-bold px-2 py-0.5 rounded border border-rose-500/30">CẢNH BÁO NGẠT OXY</span>
            </div>
            
            <div class="flex items-baseline space-x-2">
                <span id="predicted-do" class="text-4xl font-black text-slate-500">--.--</span>
                <span class="text-sm text-slate-400 font-bold">mg/L</span>
            </div>

            <!-- Action Prescription -->
            <p id="ai-prescription" class="text-xs text-slate-400 border-t border-slate-800 pt-3">
                Sẵn sàng chạy mô hình ONNX On-Device...
            </p>
        </div>
    </div>

    <!-- ONNX ENGINE JAVASCRIPT -->
    <script>
        let session = null;

        // Cấu hình tham số Chuẩn hóa Scaler (StandardScaler: (x - mean) / std)
        const SCALER_MEAN = [8.0, 28.5, 250.0, 18.0];
        const SCALER_STD  = [0.5,  2.1,  80.0,  4.5];

        // 1. Tải mô hình ONNX khi trang mở lên
        async function loadONNXModel() {
            const statusBadge = document.getElementById('ai-status');
            const btnPredict = document.getElementById('btn-predict');

            try {
                // Khởi tạo Session ONNX với WASM/WebGL Execution Provider
                session = await ort.InferenceSession.create('./model/do_predictor.onnx', {
                    executionProviders: ['wasm', 'webgl']
                });

                statusBadge.innerText = "AI ONLINE";
                statusBadge.className = "bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/30";
                btnPredict.disabled = false;
                console.log("ONNX Model đã nạp thành công vào trình duyệt.");
            } catch (e) {
                console.warn("Chưa tìm thấy tệp do_predictor.onnx, kích hoạt chế độ AI Fallback Simulator.");
                statusBadge.innerText = "AI SIMULATOR";
                statusBadge.className = "bg-sky-500/20 text-sky-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-sky-500/30";
                btnPredict.disabled = false;
            }
        }

        // 2. Chạy suy luận (Inference)
        async function runInference() {
            const ph = parseFloat(document.getElementById('input-ph').value);
            const temp = parseFloat(document.getElementById('input-temp').value);
            const orp = parseFloat(document.getElementById('input-orp').value);
            const ec = parseFloat(document.getElementById('input-ec').value);

            let predictedDO = 0;

            if (session) {
                try {
                    // Pre-processing: Chuẩn hóa Z-Score dữ liệu đầu vào
                    const norm_ph = (ph - SCALER_MEAN[0]) / SCALER_STD[0];
                    const norm_temp = (temp - SCALER_MEAN[1]) / SCALER_STD[1];
                    const norm_orp = (orp - SCALER_MEAN[2]) / SCALER_STD[2];
                    const norm_ec = (ec - SCALER_MEAN[3]) / SCALER_STD[3];

                    // Tạo Tensor dạng [1, 4] (Float32)
                    const inputData = Float32Array.from([norm_ph, norm_temp, norm_orp, norm_ec]);
                    const tensorInput = new ort.Tensor('float32', inputData, [1, 4]);

                    // Chạy mô hình ONNX
                    const feeds = { float_input: tensorInput };
                    const results = await session.run(feeds);
                    
                    // Lấy kết quả Output
                    const outputTensor = results.variable || Object.values(results)[0];
                    predictedDO = outputTensor.data[0];
                } catch (err) {
                    console.error("Lỗi khi chạy ONNX:", err);
                    predictedDO = fallbackAIEngine(ph, temp, orp, ec);
                }
            } else {
                // Thuật toán AI Fallback On-Device
                predictedDO = fallbackAIEngine(ph, temp, orp, ec);
            }

            // Render kết quả lên màn hình
            renderResult(predictedDO);
        }

        // 3. Thuật toán AI Fallback (Local Rule-based Matrix)
        function fallbackAIEngine(ph, temp, orp, ec) {
            let baseDO = 6.5;
            baseDO -= (temp - 25.0) * 0.12;  // Nhiệt độ cao làm giảm khả năng hòa tan Oxy
            baseDO -= (ph > 8.5) ? 0.8 : 0;  // pH quá cao báo hiệu tảo nở hoa/suy tàn
            baseDO += (orp - 200) * 0.005;   // ORP cao thể hiện đáy ao hiếu khí tốt
            return Math.max(1.0, Math.min(10.0, baseDO));
        }

        // 4. Cập nhật giao diện & Khuyên dùng hành động (Prescription)
        function renderResult(doValue) {
            const doDisplay = document.getElementById('predicted-do');
            const warningBadge = document.getElementById('warning-badge');
            const prescription = document.getElementById('ai-prescription');

            doDisplay.innerText = doValue.toFixed(2);

            if (doValue < 4.0) {
                doDisplay.className = "text-4xl font-black text-rose-500 animate-pulse";
                warningBadge.classList.remove('hidden');
                prescription.innerHTML = `<span class="text-rose-400 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> RỦI RO NGUY HIỂM:</span> Nguy cơ ngạt Oxy trong 3h tới. Kích hoạt tự động Quạt nước <b>Y2</b> và Bơm cấp <b>Y1</b> ngay lập tức.`;
            } else {
                doDisplay.className = "text-4xl font-black text-emerald-400";
                warningBadge.classList.add('hidden');
                prescription.innerHTML = `<span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check"></i> AN TOÀN:</span> Chỉ số Oxy ổn định. Duy trì chu trình sục khí định kỳ.`;
            }
        }

        // Tải mô hình khi ứng dụng sẵn sàng
        window.onload = loadONNXModel;
    </script>
</body>
</html>
